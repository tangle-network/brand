name: Shared control accessibility

on:
  pull_request:
    paths:
      - '.github/workflows/control-accessibility.yml'
      - '.storybook/**'
      - 'packages/brand/**'
      - 'packages/ui/**'
      - 'tests/visual/control-accessibility.spec.mjs'
      - 'playwright.config.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shared-control-accessibility-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser:
    runs-on: [self-hosted, Linux, X64, ci-public]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.3
          cache: pnpm
      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium and system dependencies
        run: pnpm exec playwright install --with-deps chromium
      - name: Build the existing Storybook
        run: pnpm --filter @tangle-network/brand build && pnpm build-storybook --quiet
      - name: Verify control geometry and upload recovery in Chromium
        run: pnpm exec playwright test tests/visual/control-accessibility.spec.mjs --workers=2 --reporter=html,github
        env:
          CI: 'true'
          PLAYWRIGHT_HTML_OPEN: never
      - name: Upload browser report, screenshots and failure traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shared-control-accessibility-${{ github.sha }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 1
