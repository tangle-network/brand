name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  id-token: write
  packages: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Upgrade npm for OIDC trusted publishing
        # OIDC trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
        # Without this, `changeset publish` uses the old npm + a token that
        # 404s on the @tangle-network scope. Mirrors sandbox-ui's working job.
        # npm 12.0.1 fixes the 12.0.0 sigstore/provenance regression.
        run: npm install -g npm@12.0.1

      - name: Force OIDC auth (strip empty npm token line)
        # setup-node writes a `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
        # line into the npm userconfig it points NPM_CONFIG_USERCONFIG at
        # (/home/runner/work/_temp/.npmrc) — NOT just ~/.npmrc. With no
        # NODE_AUTH_TOKEN the token expands empty, so `changeset publish`
        # attempts (failing) token auth and 404s on the @tangle-network scope
        # instead of falling back to OIDC trusted publishing. Strip the line
        # from every npmrc npm might read so it authenticates via OIDC.
        run: |
          for f in "$HOME/.npmrc" "${NPM_CONFIG_USERCONFIG:-}" "$RUNNER_TEMP/.npmrc" "$GITHUB_WORKSPACE/.npmrc"; do
            if [ -n "$f" ] && [ -f "$f" ]; then
              sed -i '/_authToken=/d' "$f" || true
              echo "stripped _authToken from $f"
            fi
          done

      - name: Create release PR or publish
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: pnpm release
          version-script: pnpm version-packages
          commit-message: "chore(release): publish packages"
          pr-title: "chore(release): publish packages"
          push-with-git-cli: true
        # No NODE_AUTH_TOKEN: with `id-token: write` + a configured npm trusted
        # publisher for @tangle-network/brand and @tangle-network/ui, npm
        # authenticates the publish via OIDC. A token here forces token auth,
        # which 404s on this scope (see sandbox-ui's release.yml note).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

      # Changesets reports only versions published in this run. On a retry after
      # npm succeeded, that list is empty. Rebuild the mirror plan from the
      # versioned package manifests and fetch npm's immutable tarballs instead.
      - name: Fetch and verify npm release artifacts
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/release-mirror"
          mkdir -p "$mirror"
          : > "$mirror/artifacts.ndjson"
          for file in packages/*/package.json; do
            name="$(jq -r '.name' "$file")"
            version="$(jq -r '.version' "$file")"
            private="$(jq -r '.private // false' "$file")"
            if [ "$private" = true ]; then continue; fi
            spec="$name@$version"
            expected="$(npm view "$spec" dist.integrity --json --registry=https://registry.npmjs.org | jq -r '.')"
            pack="$(npm pack "$spec" --json --pack-destination "$mirror" --registry=https://registry.npmjs.org)"
            filename="$(jq -r '.[0].filename' <<<"$pack")"
            actual="$(jq -r '.[0].integrity' <<<"$pack")"
            if [ -z "$expected" ] || [ "$expected" != "$actual" ]; then
              echo "::error::$spec npm tarball integrity differs from registry metadata"
              exit 1
            fi
            tarball="$mirror/$filename"
            manifest="$(tar -xzOf "$tarball" package/package.json)"
            if [ "$(jq -r '.name + "@" + .version' <<<"$manifest")" != "$spec" ]; then
              echo "::error::$spec npm tarball has the wrong manifest"
              exit 1
            fi
            if [ "$(jq '[.dependencies, .optionalDependencies, .peerDependencies] | map(. // {} | to_entries[]?.value | select(startswith("workspace:"))) | length' <<<"$manifest")" != 0 ]; then
              echo "::error::$spec npm tarball has an unpublishable workspace dependency"
              exit 1
            fi
            jq -cn --arg name "$name" --arg version "$version" --arg file "$tarball" --arg integrity "$expected" \
              '{name:$name,version:$version,file:$file,integrity:$integrity}' >> "$mirror/artifacts.ndjson"
          done
          if [ ! -s "$mirror/artifacts.ndjson" ]; then
            echo "::error::No public package versions were found"
            exit 1
          fi
          consumer="$RUNNER_TEMP/release-consumer"
          mkdir -p "$consumer"
          printf '{"name":"release-artifact-consumer","private":true}\n' > "$consumer/package.json"
          mapfile -t tarballs < <(jq -r '.file' "$mirror/artifacts.ndjson")
          npm install --prefix "$consumer" --package-lock=false --ignore-scripts --no-audit --no-fund "${tarballs[@]}"

      - name: Configure npm for GitHub Packages
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.23.1
          registry-url: https://npm.pkg.github.com
          scope: "@tangle-network"

      - name: Reconcile GitHub Packages from the npm artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r artifact; do
            name="$(jq -r '.name' <<<"$artifact")"
            version="$(jq -r '.version' <<<"$artifact")"
            tarball="$(jq -r '.file' <<<"$artifact")"
            expected="$(jq -r '.integrity' <<<"$artifact")"
            spec="$name@$version"
            error="$RUNNER_TEMP/github-package-view.err"
            if observed="$(npm view "$spec" dist.integrity --json --registry=https://npm.pkg.github.com 2>"$error" | jq -r '.')"; then
              if [ "$observed" != "$expected" ]; then
                # Brand 1.7.0 was published before exact-artifact mirroring.
                # Its separate npm pack differs but has passed a strict external
                # install. Any new mismatch remains a release failure.
                known="$(jq -c --arg spec "$spec" '.[$spec] // null' .github/release-artifact-exceptions.json)"
                if [ "$(jq -r '.npm' <<<"$known")" = "$expected" ] && \
                   [ "$(jq -r '.github' <<<"$known")" = "$observed" ]; then
                  echo "::warning::$spec is a verified legacy mirror with different tarball bytes"
                  continue
                fi
                echo "::error::$spec exists at GitHub Packages with different bytes"
                exit 1
              fi
              echo "$spec already mirrors npm exactly"
              continue
            fi
            if ! grep -Eq 'E404|404 Not Found' "$error"; then cat "$error"; exit 1; fi
            npm publish "$tarball" --registry=https://npm.pkg.github.com --provenance=false
            for _ in {1..12}; do
              observed="$(npm view "$spec" dist.integrity --json --registry=https://npm.pkg.github.com 2>/dev/null | jq -r '.' || true)"
              if [ "$observed" = "$expected" ]; then break; fi
              sleep 5
            done
            if [ "$observed" != "$expected" ]; then
              echo "::error::$spec GitHub Packages integrity is missing or differs after publish"
              exit 1
            fi
          done < "$RUNNER_TEMP/release-mirror/artifacts.ndjson"

      - name: Reconcile GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          while IFS= read -r artifact; do
            name="$(jq -r '.name' <<<"$artifact")"
            version="$(jq -r '.version' <<<"$artifact")"
            tag="$name@$version"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "$tag already has a GitHub Release"
              continue
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              gh release create "$tag" --verify-tag --title "$tag" --generate-notes
              continue
            fi
            # First-parent history identifies the merge that introduced this
            # version, even when this workflow is rerun after a later push.
            package="packages/${name#@tangle-network/}/package.json"
            source=""
            while IFS= read -r sha; do
              observed="$(git show "$sha:$package" 2>/dev/null | jq -r '.version' 2>/dev/null || true)"
              if [ "$observed" != "$version" ]; then break; fi
              source="$sha"
            done < <(git rev-list --first-parent HEAD)
            if [ -z "$source" ]; then
              echo "::error::Cannot identify the source merge for $tag"
              exit 1
            fi
            gh release create "$tag" --target "$source" --title "$tag" --generate-notes
          done < "$RUNNER_TEMP/release-mirror/artifacts.ndjson"
